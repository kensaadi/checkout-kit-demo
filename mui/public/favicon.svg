<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="checkout-kit">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#g)"/>

  <!-- Shopping bag body (white trapezoid, slight outward curve at base) -->
  <path d="M 156 232 L 356 232 L 376 404 Q 376 420 360 420 L 152 420 Q 136 420 136 404 Z" fill="#FFFFFF"/>

  <!-- Bag handle (white stroke arc above the body) -->
  <path d="M 210 232 Q 210 168 256 168 Q 302 168 302 232" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>

  <!-- Check mark inside the bag (gradient stroke "stamped" through) -->
  <path d="M 196 322 L 240 366 L 322 280" fill="none" stroke="url(#g)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
