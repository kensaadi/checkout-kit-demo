    <path d="M 196 322 L 240 366 L 322 280" fill="none" stroke="url(#iconCheck)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="430" y="245" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">checkout-kit</text>

  <text x="430" y="325" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="600">Production Stripe Checkout</text>
